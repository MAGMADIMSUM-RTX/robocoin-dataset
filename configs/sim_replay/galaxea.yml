
sim:
  xml_path: "configs/sim_replay/mjcfs/galaxea_r1_lite/mmp_revB_invconfig_upright_a1x_with_sites.xml"  # 仿真模型路径

  module_file: config.sim_replay.galaxea
  function: get_mjcf_gripper_joint_data

  joints:
    left_arm_joint1: left_arm_joint_1_rad
    left_arm_joint2: left_arm_joint_2_rad
    left_arm_joint3: left_arm_joint_3_rad
    left_arm_joint4: left_arm_joint_4_rad
    left_arm_joint5: left_arm_joint_5_rad
    left_arm_joint6: left_arm_joint_6_rad
    left_arm_joint7: left_arm_joint_7_rad
    right_arm_joint1: right_arm_joint_1_rad
    right_arm_joint2: right_arm_joint_2_rad
    right_arm_joint3: right_arm_joint_3_rad
    right_arm_joint4: right_arm_joint_4_rad
    right_arm_joint5: right_arm_joint_5_rad
    right_arm_joint6: right_arm_joint_6_rad
    right_arm_joint7: right_arm_joint_7_rad
    left_gripper_finger_joint1: fl_joint7
    left_gripper_finger_joint2: fl_joint8
    right_gripper_finger_joint1: fr_joint7
    right_gripper_finger_joint2: fr_joint8
                                          
  # 物理世界的限制 (MuJoCo 中的实际行程, 单位: 米或弧度)
  gripper_config:
    gripper_name:
      - left_gripper_open
      - right_gripper_open
    gripper_joint_max: 0.05  # 物理完全张开的宽度
    gripper_joint_min: 0.0   # 物理完全闭合的宽度
    gripper: True

  camera:   # 相机参数可以从 tools/sim_replay/get_camara.py 中获取
    lookat_x: 0.487  
    lookat_y: -0.000
    lookat_z: 0.824
    distance: 2.000
    azimuth: -0.250
    elevation: -81.250

default_version:
  gripper_config:
    gripper_value_open: 1.750  # 数据中表示"开"的值
    # gripper_value_open: 1.75  # 数据中表示"开"的值
    gripper_value_close: 0.0 # 数据中表示"关"的值

h5_mp4_version:
  gripper_config:
    gripper_value_open: 1.750  # 数据中表示"开"的值
    # gripper_value_open: 1.75  # 数据中表示"开"的值
    gripper_value_close: 0.0 # 数据中表示"关"的值

default_mcap:
  gripper_config:
    gripper_value_open: 1.750  # 数据中表示"开"的值
    # gripper_value_open: 1.75  # 数据中表示"开"的值
    gripper_value_close: 0.0 # 数据中表示"关"的值


show_plt: 
- left_gripper_open
- right_gripper_open