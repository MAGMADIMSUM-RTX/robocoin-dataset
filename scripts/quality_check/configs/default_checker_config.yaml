# Dataset-level checkers (作用于整个数据集)
dataset_data_checkers:
  - name: "few_episode_frames"
    params:
      threshold: 150
    should_check: True  

  - name: "too_few_episodes"
    params:
      threshold: 30
    should_check: True  

  - name: "abnormal_episode_length"
    params:
      threshold: 4.0
    should_check: True  

# Episode-level data checkers (作用于每个 episode 的数值数据，如关节角)
episode_data_checkers:
  - name: "static_frame_rate"
    params:
      window_size: 5
      threshold: 0.01
    should_check: True  
    score_weight: 1.0   

  - name: "static_joint"
    params:
      static_joints_percent: 0.6
      epsilon: 0.001
    should_check: True  
    score_weight: 1.0   

episode_video_checkers:
  - name: "max_frame_stable_then_jump_rate"
    should_check: True  
    score_weight: 1.0   

  - name: "max_frame_jump_dist"
    should_check: True  
    max_dist_threshold: 50
    score_weight: 1.0   

  - name: "video_color_shift_detection"  # 必须和算子注册名一致
    should_check: True                    # 启用
    color_diff_threshold: 30.0            # 自定义参数
    score_weight: 1.0                     # 得分权重