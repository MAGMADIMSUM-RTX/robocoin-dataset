fps: 30
features:
  observation:
    images:
    - cam_name: cam_front_head_rgb
      args:
        h5_path: observations/images/cam_high
    - cam_name: cam_left_wrist_rgb
      args:
        h5_path: observations/images/cam_left_wrist
    - cam_name: cam_right_wrist_rgb
      args:
        h5_path: observations/images/cam_right_wrist

    state:
      sub_state:
      # 左手关节 - 原先是0-6，现在改为50-56（原右手区间）
      - names: 
        - left_arm_joint_1_rad
        - left_arm_joint_2_rad
        - left_arm_joint_3_rad
        - left_arm_joint_4_rad
        - left_arm_joint_5_rad
        - left_arm_joint_6_rad
        args:
          h5_path: observations/qpos
          range_from: 50  # 修改：原0 → 50
          range_to: 56    # 修改：原6 → 56

      # 左手夹爪 - 原先是10-11，现在改为60-61（原右手区间）
      - names: 
        - left_gripper_open
        args:
          h5_path: observations/qpos
          range_from: 60  # 修改：原10 → 60
          range_to: 61    # 修改：原11 → 61
        # convert_func: multiply_by_10

      # 左手EEF位置 - 原先是30-33，现在改为80-83（原右手区间）
      - names: 
        - left_eef_pos_x_m
        - left_eef_pos_y_m
        - left_eef_pos_z_m
        args:
          h5_path: observations/qpos
          range_from: 80  # 修改：原30 → 80
          range_to: 83    # 修改：原33 → 83

      # 左手EEF旋转 - 原先是33-39，现在改为83-89（原右手区间）
      - names: 
        - left_eef_rot_euler_x_rad
        - left_eef_rot_euler_y_rad
        - left_eef_rot_euler_z_rad
        args:
          h5_path: observations/qpos
          range_from: 83  # 修改：原33 → 83
          range_to: 89    # 修改：原39 → 89
        convert_func: rot6d_to_euler_xyz

      # 右手关节 - 原先是50-56，现在改为0-6（原左手区间）
      - names: 
        - right_arm_joint_1_rad
        - right_arm_joint_2_rad
        - right_arm_joint_3_rad
        - right_arm_joint_4_rad
        - right_arm_joint_5_rad
        - right_arm_joint_6_rad
        args:
          h5_path: observations/qpos
          range_from: 0   # 修改：原50 → 0
          range_to: 6     # 修改：原56 → 6

      # 右手夹爪 - 原先是60-61，现在改为10-11（原左手区间）
      - names: 
        - right_gripper_open
        args:
          h5_path: observations/qpos
          range_from: 10  # 修改：原60 → 10
          range_to: 11    # 修改：原61 → 11
        # convert_func: multiply_by_10

      # 右手EEF位置 - 原先是80-83，现在改为30-33（原左手区间）
      - names: 
        - right_eef_pos_x_m
        - right_eef_pos_y_m
        - right_eef_pos_z_m
        args:
          h5_path: observations/qpos
          range_from: 30  # 修改：原80 → 30
          range_to: 33    # 修改：原83 → 33

      # 右手EEF旋转 - 原先是83-89，现在改为33-39（原左手区间）
      - names: 
        - right_eef_rot_euler_x_rad
        - right_eef_rot_euler_y_rad
        - right_eef_rot_euler_z_rad
        args:
          h5_path: observations/qpos
          range_from: 33  # 修改：原83 → 33
          range_to: 39    # 修改：原89 → 39
        convert_func: rot6d_to_euler_xyz

  action:
    timeline_offset: 1
    sub_action:
      # 左手关节 - 原0-6 → 50-56
      - names: 
        - left_arm_joint_1_rad
        - left_arm_joint_2_rad
        - left_arm_joint_3_rad
        - left_arm_joint_4_rad
        - left_arm_joint_5_rad
        - left_arm_joint_6_rad
        args:
          h5_path: observations/qpos
          range_from: 50  # 修改：原0 → 50
          range_to: 56    # 修改：原6 → 56
      
      # 左手夹爪 - 原10-11 → 60-61
      - names: 
        - left_gripper_open
        args:
          h5_path: observations/qpos
          range_from: 60  # 修改：原10 → 60
          range_to: 61    # 修改：原11 → 61

      # 左手EEF位置 - 原30-33 → 80-83
      - names: 
        - left_eef_pos_x_m
        - left_eef_pos_y_m
        - left_eef_pos_z_m
        args:
          h5_path: observations/qpos
          range_from: 80  # 修改：原30 → 80
          range_to: 83    # 修改：原33 → 83

      # 左手EEF旋转 - 原33-39 → 83-89
      - names: 
        - left_eef_rot_euler_x_rad
        - left_eef_rot_euler_y_rad
        - left_eef_rot_euler_z_rad
        args:
          h5_path: observations/qpos
          range_from: 83  # 修改：原33 → 83
          range_to: 89    # 修改：原39 → 89
        convert_func: rot6d_to_euler_xyz

      # 右手关节 - 原50-56 → 0-6
      - names: 
        - right_arm_joint_1_rad
        - right_arm_joint_2_rad
        - right_arm_joint_3_rad
        - right_arm_joint_4_rad
        - right_arm_joint_5_rad
        - right_arm_joint_6_rad
        args:
          h5_path: observations/qpos
          range_from: 0   # 修改：原50 → 0
          range_to: 6     # 修改：原56 → 6

      # 右手夹爪 - 原60-61 → 10-11
      - names: 
        - right_gripper_open
        args:
          h5_path: observations/qpos
          range_from: 10  # 修改：原60 → 10
          range_to: 11    # 修改：原61 → 11

      # 右手EEF位置 - 原80-83 → 30-33
      - names: 
        - right_eef_pos_x_m
        - right_eef_pos_y_m
        - right_eef_pos_z_m
        args:
          h5_path: observations/qpos
          range_from: 30  # 修改：原80 → 30
          range_to: 33    # 修改：原83 → 33

      # 右手EEF旋转 - 原83-89 → 33-39
      - names: 
        - right_eef_rot_euler_x_rad
        - right_eef_rot_euler_y_rad
        - right_eef_rot_euler_z_rad
        args:
          h5_path: observations/qpos
          range_from: 33  # 修改：原83 → 33
          range_to: 39    # 修改：原89 → 39
        convert_func: rot6d_to_euler_xyz
